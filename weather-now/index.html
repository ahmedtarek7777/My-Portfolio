<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather Now</title>
<link rel="stylesheet" href="style.css?v=3">
</head>
<body><a href="../#work" style="display:block;text-align:center;background:#14151a;color:#eee;padding:10px;font:12px sans-serif">← Back to Ahmed's project gallery</a>
<main class="app">
  <h1>Weather <span>Now</span></h1>
  <form id="searchForm" class="search">
    <input id="city" type="text" placeholder="Search a city... (e.g. Cairo)" autocomplete="off">
    <button type="submit">Search</button>
  </form>
  <div id="suggest" class="suggest" hidden></div>

  <p id="status" class="status"></p>

  <section id="current" class="current" hidden>
    <div class="cleft">
      <h2 id="place"></h2>
      <p id="cond" class="cond"></p>
      <p class="big"><span id="temp"></span>°C</p>
      <p id="feels" class="feels"></p>
    </div>
    <div class="cright">
      <div class="stat">💨 <b id="wind"></b><small>Wind km/h</small></div>
      <div class="stat">💧 <b id="hum"></b><small>Humidity</small></div>
      <div class="stat">🌡️ <b id="hi"></b><small>High</small></div>
      <div class="stat">❄️ <b id="lo"></b><small>Low</small></div>
    </div>
  </section>

  <section id="forecastWrap" hidden>
    <h3>Next 5 days</h3>
    <div id="forecast" class="forecast"></div>
  </section>

  <footer class="src">Data: Open-Meteo (free, no key)</footer>
</main>
<script src="app.js?v=3"></script>
</body>
</html>
