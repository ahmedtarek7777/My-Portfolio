<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Budget Lab | Ahmed Studio</title><link rel="stylesheet" href="../studio.css?v=3"><body style="--accent:#95c9ac"><header class="appbar"><a class="brand" href="./">Budget Lab<span style="color:var(--accent)">.</span></a><div class="actions"><a class="button" href="../#work">← All projects</a><button id="theme" aria-label="Toggle color theme">◐</button></div></header><main class="workspace"><div class="titlebar"><div><span class="badge">Ahmed Studio / Interactive demo</span><h1>Give every dollar a direction.</h1></div><span class="muted">Local-first · No account required</span></div><div class="notice">Manual planning demo. Not connected to a bank. Use sample data, not sensitive financial records.</div><div id="stats" class="grid cols3"></div><div class="grid cols2" style="margin-top:25px"><section class="panel"><div class="row"><h2>Cash flow</h2><input id="month" type="month" aria-label="Filter month"></div><canvas id="chart" width="750" height="240"></canvas><div id="transactions" class="tablewrap"></div></section><aside class="panel"><h2>Add transaction</h2><form id="add" class="stack"><label>Description<input id="description" required maxlength="120"></label><label>Amount (USD)<input id="amount" type="number" min="0.01" max="100000000" step=".01" required></label><label>Type<select id="type"><option>Expense</option><option>Income</option></select></label><label>Category<select id="category"><option>Food</option><option>Transport</option><option>Housing</option><option>Leisure</option><option>Salary</option><option>Other</option></select></label><label>Date<input id="date" type="date" required></label><button class="primary">Save transaction</button></form><button id="export" style="margin-top:20px">Export JSON</button></aside></div><section class="panel" style="margin-top:25px"><h2>Monthly category limits</h2><div id="budgets" class="grid cols4"></div></section></main><script src="../studio.js?v=3"></script><script src="app.js?v=3"></script></body></html>
