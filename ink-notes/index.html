<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ink Notes | Ahmed Studio</title><link rel="stylesheet" href="../studio.css?v=3"><body style="--accent:#c6a1c8"><header class="appbar"><a class="brand" href="./">Ink Notes<span style="color:var(--accent)">.</span></a><div class="actions"><a class="button" href="../#work">← All projects</a><button id="theme" aria-label="Toggle color theme">◐</button></div></header><main class="workspace"><div class="titlebar"><div><span class="badge">Ahmed Studio / Interactive demo</span><h1>A clear space for your thinking.</h1></div><span class="muted">Local-first · No account required</span></div><div class="grid" style="grid-template-columns:260px 1fr"><aside class="panel"><button id="new" class="primary">+ New note</button><input id="search" placeholder="Search notes" aria-label="Search notes" style="width:100%;margin-top:18px"><div id="list"></div></aside><section class="panel"><div class="actions"><button id="edit">Edit</button><button id="preview">Preview Markdown</button><button id="export">Export .md</button><button id="delete">Delete note</button></div><div id="editor" class="stack" style="margin-top:22px"><input id="title" placeholder="Untitled note" aria-label="Note title"><input id="tags" placeholder="Tags, separated by commas" aria-label="Tags"><textarea id="content" aria-label="Note content" style="width:100%;min-height:420px;line-height:1.8"></textarea></div><article id="rendered" hidden style="line-height:1.9;padding:20px"></article><p id="count"></p></section></div><style>@media(max-width:750px){.workspace>.grid{grid-template-columns:1fr!important}}</style></main><script src="../studio.js?v=3"></script><script src="app.js?v=3"></script></body></html>
