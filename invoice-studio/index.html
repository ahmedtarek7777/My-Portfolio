<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>Invoice Studio | Ahmed Studio</title
  ><link rel="stylesheet" href="../studio.css?v=3" />
  <body style="--accent: #c8bb91">
    <header class="appbar">
      <a class="brand" href="./"
        >Invoice Studio<span style="color: var(--accent)">.</span></a
      >
      <div class="actions">
        <a class="button" href="../#work">← All projects</a
        ><button id="theme" aria-label="Toggle color theme">◐</button>
      </div>
    </header>
    <main class="workspace">
      <div class="titlebar">
        <div>
          <span class="badge">Ahmed Studio / Interactive demo</span>
          <h1>From work done to well presented.</h1>
        </div>
        <span class="muted">Local-first · No account required</span>
      </div>
      <div class="notice">
        Invoice design tool. No invoice is emailed and no payment is collected.
        Confirm tax and legal requirements separately.
      </div>
      <div class="actions" style="margin-bottom: 20px">
        <button id="save">Save draft</button
        ><button id="print" class="primary">Print / Save PDF</button
        ><button id="download">Export JSON</button>
      </div>
      <div class="grid cols2">
        <section id="invoice" class="panel">
          <div class="row">
            <h2>INVOICE</h2>
            <span id="numberPreview"></span>
          </div>
          <div id="clientPreview"></div>
          <div id="lines" class="tablewrap"></div>
          <div id="totals"></div>
          <p id="notePreview"></p>
        </section>
        <aside class="panel">
          <h2>Invoice details</h2>
          <form id="details" class="stack">
            <label
              >Your business<input
                id="business"
                value="Your Studio"
                required /></label
            ><label
              >Client name<input
                id="client"
                value="Example Client"
                required /></label
            ><label
              >Invoice number<input
                id="number"
                value="INV-001"
                required /></label
            ><label>Due date<input id="due" type="date" /></label
            ><label
              >Tax (%)<input
                id="tax"
                type="number"
                value="0"
                min="0"
                max="100" /></label
            ><label
              >Discount (USD)<input
                id="discount"
                type="number"
                value="0"
                min="0" /></label
            ><label
              >Notes<textarea id="notes">Thank you for your business.</textarea>
            </label>
          </form>
          <h2 style="margin-top: 25px">Line items</h2>
          <form id="add" class="stack">
            <input
              id="description"
              placeholder="Service description"
              aria-label="Service description"
              required
            />
            <div class="actions">
              <input
                id="qty"
                type="number"
                min="1"
                value="1"
                aria-label="Quantity"
                required
              /><input
                id="rate"
                type="number"
                min="0"
                step=".01"
                placeholder="Unit price"
                aria-label="Unit price"
                required
              />
            </div>
            <button>Add item</button>
          </form>
          <div id="editLines"></div>
        </aside>
      </div>
      <style>
        @media print {
          header,
          .titlebar,
          .notice,
          .actions,
          aside {
            display: none !important;
          }
          .workspace {
            padding: 0;
          }
          body {
            background: white;
            color: black;
          }
          #invoice {
            border: 0;
            background: white;
            color: black;
            min-height: 90vh;
          }
          #invoice p {
            color: #333;
          }
          .cols2 {
            display: block;
          }
          #invoice th,
          #invoice td {
            border-color: #ddd;
          }
          .positive {
            color: black;
          }
        }
      </style>
    </main>
    <script src="../studio.js?v=3"></script>
    <script src="app.js?v=3"></script>
  </body>
</html>
