<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Quiz Academy | Ahmed Studio</title>
    <link rel="stylesheet" href="../studio.css?v=3" />
  </head>
  <body style="--accent: #a8bddd">
    <header class="appbar">
      <a class="brand" href="./"
        >Quiz Academy<span style="color: var(--accent)">.</span></a
      >
      <div class="actions">
        <a class="button" href="../#work">← All projects</a
        ><button id="theme" aria-label="Toggle color theme">◐</button>
      </div>
    </header>
    <main class="workspace">
      <div class="titlebar">
        <div>
          <span class="badge">Ahmed Studio / Interactive demo</span>
          <h1>Learn by putting it to the test.</h1>
        </div>
        <span class="muted">Local-first · No account required</span>
      </div>
      <div class="grid cols2">
        <section class="panel">
          <div class="tabs" id="topics"></div>
          <div id="quiz"></div>
        </section>
        <aside class="panel">
          <h2>Your learning record</h2>
          <div id="history"></div>
          <h2 style="margin-top: 30px">Understand the why.</h2>
          <p>
            Every question includes an explanation. Review answers after each
            attempt and keep track of your progress on this device.
          </p>
        </aside>
      </div>
    </main>
    <script src="../studio.js?v=3"></script>
    <script src="app.js?v=3"></script>
  </body>
</html>
